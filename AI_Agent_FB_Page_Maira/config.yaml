    hashtags: "#GoodNight #SweetDreams #NightOwl #PeacefulVibes #RestAndRecharge #FaithAndGrace #GratefulEveryDay #MairaDash"

paths:
  reference_face: "assets/reference_face.jpg"
  browser_profile: "browser_profile"
  generated_dir: "generated"
  log_file: "logs/agent.log"
  history_file: "logs/post_history.json"

chatgpt:
  # Browser automation settings for ChatGPT (Free web tier)
  url: "https://chatgpt.com"
  headless: false   # false is recommended for ChatGPT to avoid Cloudflare/bot challenges
  timeout_seconds: 180
  retry_count: 2

facebook:
  # Choose posting method: "browser" (Playwright UI) or "api" (Graph API)
  method: "browser"
  # Target 1: Facebook Page
  page_url: "https://www.facebook.com/Maira.Dash.Page/"
  # Target 2: Personal Profile
  profile_url: "https://www.facebook.com/maira.dash/"
  location: "Odisha, India"
  ai_label: true
  share_to_story: true
  post_to_profile: true
  share_to_profile_story: true
  # Graph API options (optional if method is "api")
  page_id: ""
  access_token: ""
